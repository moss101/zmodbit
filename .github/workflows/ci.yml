name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install protoc
        shell: bash
        run: |
          if command -v protoc >/dev/null 2>&1; then
            protoc --version
          elif [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y protobuf-compiler
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install protobuf
          else
            choco install protoc -y --no-progress
          fi

      - name: Rust lint (warnings policy, docs/70 PR pipeline step 1-2)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust build
        run: cargo build --workspace --all-targets

      - name: Rust tests (includes protobuf round-trip + golden fixtures)
        run: cargo test --workspace

      - name: TypeScript install
        run: pnpm install --frozen-lockfile

      - name: Regenerate TS bindings and require zero drift (docs/70)
        run: |
          pnpm -r generate
          git diff --exit-code -- packages/surface-protocol/src/generated

      - name: TypeScript build/typecheck
        run: pnpm -r typecheck

      - name: TypeScript tests (Rust↔TS wire compatibility)
        run: pnpm -r test

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Forbidden dependency self-test (must prove detection works)
        run: python3 tools/architecture-lint/lint.py --self-test

      - name: Architecture dependency lint (docs/12, PR pipeline step 4)
        run: python3 tools/architecture-lint/lint.py

      - name: Decision guard self-test (must prove locked-file detection works)
        run: python3 tools/decision-guard.py --self-test

      - name: Decision guard — locked files need linked ADRs (docs/02 change control)
        run: python3 tools/decision-guard.py
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Coverage guard self-test (must prove traceability rules work)
        run: python3 tools/coverage-guard.py --self-test

      - name: Requirement-coverage CI and REQ→IMP→QUAL join (docs/45, M0.4)
        run: python3 tools/coverage-guard.py

      - name: Dossier integrity gate
        run: python3 tools/check_dossier.py

      - name: Examples runner (REQ-EV-0212: no fake test examples)
        run: |
          python3 tools/examples_runner.py --self-test
          python3 tools/examples_runner.py
