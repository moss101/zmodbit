[workspace]
resolver = "2"
members = [
    "crates/*",
    "services/*",
    "apps/cloud-api",
    "apps/cloud-worker",
    "apps/sandbox-gateway",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v7", "serde"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "net", "fs"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls", "gzip"] }
futures = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"
