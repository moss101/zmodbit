[package]
name = "modbit-cloud-api"
version.workspace = true
edition.workspace = true

[[bin]]
name = "modbit-cloud-api"
path = "src/main.rs"

[[bin]]
name = "fixture-issuer"
path = "src/bin/fixture-issuer.rs"

[dependencies]
base64 = "0.22"
jsonwebtoken = "9"
prost = "0.13"
rand = "0.8"
rsa = "0.9"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true, features = ["oid"] }
modbit-protocol = { path = "../../crates/protocol" }

[dev-dependencies]
modbit-browser = { path = "../../crates/browser" }
modbit-event-store = { path = "../../crates/event-store" }
uuid = { workspace = true }


[lints]
workspace = true
