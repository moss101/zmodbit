[package]
name = "modbit-providers"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
base64 = "0.22"
tokio = { workspace = true }
tokio-util = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }

[lints]
workspace = true

# Phase 4 item 3 (docs/36 admission): the `keyring` crate (MIT/Apache-2.0)
# gives the native OS secret stores — macOS Keychain, Windows Credential
# Manager, Linux Secret Service — behind one API. Per-OS features so no
# platform builds another's backend.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# linux-native (kernel keyutils) needs NO system dbus at build time —
# the dbus-backed Secret Service variant broke CI builds (libdbus).
# Switch the feature to sync-secret-service when a dbus-backed store is
# genuinely required.
keyring = { version = "3", features = ["linux-native"] }

[dev-dependencies]
uuid = { workspace = true }
