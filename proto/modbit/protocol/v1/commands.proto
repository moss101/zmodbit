syntax = "proto3";

package modbit.protocol.v1;

import "google/protobuf/timestamp.proto";
import "modbit/protocol/v1/common.proto";

// Canonical command envelope (docs/30 § Canonical command envelope).
// Mutating commands are idempotent by command_id; mutating commands carry
// expected_generation for aggregate-level optimistic concurrency.
message CommandEnvelope {
  string command_id = 1;
  string tenant_id = 2;
  string user_id = 3;
  optional string session_id = 4;
  optional string aggregate_id = 5;
  optional uint64 expected_generation = 6;
  string command_type = 7;
  SchemaVersion schema_version = 8;
  bytes payload = 9;
  google.protobuf.Timestamp issued_at = 10;
}

message CreateSessionCommand {
  string display_name = 1;
}

message CreateTaskCommand {
  string session_id = 1;
  string title = 2;
  string prompt = 3;
}

message CancelTaskCommand {
  string task_id = 1;
  string reason = 2;
}
