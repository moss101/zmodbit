syntax = "proto3";

package modbit.protocol.v1;

import "google/protobuf/timestamp.proto";
import "modbit/protocol/v1/common.proto";

// Canonical command envelope (docs/30 § Canonical command envelope).
// Mutating commands are idempotent by command_id; mutating commands carry
// expected_generation for aggregate-level optimistic concurrency.
message CommandEnvelope {
  string command_id = 1;
  string tenant_id = 2;
  string user_id = 3;
  optional string session_id = 4;
  optional string aggregate_id = 5;
  optional uint64 expected_generation = 6;
  string command_type = 7;
  SchemaVersion schema_version = 8;
  bytes payload = 9;
  google.protobuf.Timestamp issued_at = 10;
}

message CreateSessionCommand {
  string display_name = 1;
}

message CreateTaskCommand {
  string session_id = 1;
  string title = 2;
  string prompt = 3;
  // Phase 4.1: run the task against a registered repository and base
  // branch (empty = the daemon's default repo source).
  string repo_id = 4;
  string base_branch = 5;
  // Phase 7 item 1: parent task when this task is a spawned child agent
  // (parent-child fleet linkage).
  string parent_task_id = 6;
  // Phase 7 item 2 (REQ-EV-0150): comma-separated write declaration. The
  // write coordinator denies acquisition that overlaps an ACTIVE task on
  // the same repo BEFORE the task runs. Empty = undeclared (merge
  // verification still applies).
  string write_scope = 7;
}

// Phase 7 item 2: "run N variants" from New Task — one umbrella task with
// N child agents running the same objective in parallel, each in its own
// isolated worktree; compare results and merge the winner.
message RunVariantsCommand {
  string objective = 1;
  uint32 count = 2; // 2..=4 (capacity ticket bounds the lineage)
  string repo_id = 3;
  string base_branch = 4;
}

message CancelTaskCommand {
  string task_id = 1;
  string reason = 2;
}
