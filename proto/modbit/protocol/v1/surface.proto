syntax = "proto3";

package modbit.protocol.v1;

import "modbit/protocol/v1/commands.proto";
import "modbit/protocol/v1/events.proto";
import "modbit/protocol/v1/domain.proto";

// Local SurfaceProtocol request/response slice (docs/30 § Local SurfaceProtocol,
// docs/32 § startup + task composer). Commands ride the canonical envelopes;
// the desktop uses this typed surface for the M1 Fleet/New-Task vertical.
message SurfaceRequest {
  oneof request {
    CreateSessionCommand create_session = 1;
    CreateTaskCommand create_task = 2;
    GetFleetRequest get_fleet = 3;
    QueueTaskCommand queue_task = 4;
    StartTaskCommand start_task = 5;
    TaskReadyForReviewCommand task_ready_for_review = 6;
    CompleteTaskCommand complete_task = 7;
    GetTaskEventsRequest get_task_events = 8;
    GetCodeViewRequest get_code_view = 9;
    SteerTaskCommand steer_task = 10;
    PauseTaskCommand pause_task = 11;
    StopTaskCommand stop_task = 12;
    GetRunDetailRequest get_run_detail = 13;
    GetDiffRequest get_diff = 14;
    ReadOutputRefRequest read_output_ref = 15;
    // Phase 4.1: the repository picker — register (by path or clone URL)
    // and list the recent repos; tasks select a repo + base branch.
    RegisterRepoCommand register_repo = 16;
    ListRecentReposRequest list_recent_repos = 17;
    // Phase 4.2: the settings screen — persisted daemon configuration
    // (provider/model/base URL/max turns/execution mode).
    GetSettingsRequest get_settings = 18;
    UpdateSettingsCommand update_settings = 19;
    // Phase 5: the approval loop — resolve a pending protected-effect
    // approval (docs/13 Waiting(Approval), docs/23).
    ApproveEffectCommand approve_effect = 20;
    DenyEffectCommand deny_effect = 21;
    // Phase 5 item 4: hunk-level review — enumerate the changed hunks of
    // the task worktree and record an accept/reject decision per hunk
    // (reject inverse-applies the hunk; both write ReviewHunkResolved).
    GetDiffHunksRequest get_diff_hunks = 22;
    ResolveReviewHunkCommand resolve_review_hunk = 23;
    // Phase 7 item 1: children through the scheduler — transactional
    // subagent admission (docs/14) spawning a real child task with its
    // own isolated worktree; park/resume wait for the parent's flow.
    SpawnAgentCommand spawn_agent = 24;
    ParkAgentCommand park_agent = 25;
    ResumeAgentCommand resume_agent = 26;
    AgentResultRequest agent_result = 27;
  }
}

message ApproveEffectCommand {
  string approval_id = 1;
  string resolved_by = 2;
}
message DenyEffectCommand {
  string approval_id = 1;
  string reason = 2;
  string resolved_by = 3;
}

message GetSettingsRequest {}

// Phase 4.2: the persisted daemon configuration. Secrets are NEVER part
// of this message (the secret broker owns credentials).
message SettingsView {
  string provider = 1;
  string model = 2;
  string base_url = 3;
  uint32 max_turns = 4;
  string execution_mode = 5;
  // Phase 4.3: whether the current provider's API key is stored in the
  // OS keychain. The KEY ITSELF never appears in any message.
  bool has_api_key = 6;
}

// Phase 4.2: partial update — empty fields leave the stored value
// unchanged. execution_mode: "default" (full grants) | "readonly"
// (read-only grants only).
message UpdateSettingsCommand {
  string provider = 1;
  string model = 2;
  string base_url = 3;
  uint32 max_turns = 4;
  string execution_mode = 5;
  // Phase 4.3: storing an API key goes to the OS keychain and is NEVER
  // merged into the settings document, the environment, or the event
  // store. Empty = leave the stored key unchanged.
  string api_key = 6;
}

// Phase 4.1: register a repository with the daemon. Exactly one of
// `path` (an existing local repository) or `clone_url` (cloned into the
// daemon's worktree root) must be provided.
message RegisterRepoCommand {
  string path = 1;
  string clone_url = 2;
}
message RecentRepoView {
  string repo_id = 1;
  string path = 2;
  string clone_url = 3;
  string default_branch = 4;
  string registered_at = 5;
  string last_used_at = 6;
}
message RecentRepoList {
  repeated RecentRepoView repos = 1;
}
message ListRecentReposRequest {}

message GetFleetRequest {}

message GetTaskEventsRequest {
  string task_id = 1;
}

// Trusted Code Surface (docs/20 § Trusted Code Surface): immutable file
// payload bound to workspace + file revisions. The renderer never owns
// buffers; staleness is detected by revision comparison.
message CodeViewModel {
  uint64 workspace_revision = 1;
  uint64 file_revision = 2;
  string path = 3;
  string content_sha256 = 4;
  string content_text = 5;
}

message GetCodeViewRequest {
  string path = 1;
}

// Context Inspector payload: the task's durable event stream (docs/32
// task/timeline modules). Events are committed facts, never fabricated.
message TaskEvents {
  string task_id = 1;
  repeated EventEnvelope events = 2;
}

message QueueTaskCommand {
  string task_id = 1;
}
message StartTaskCommand {
  string task_id = 1;
}
message TaskReadyForReviewCommand {
  string task_id = 1;
}
message CompleteTaskCommand {
  string task_id = 1;
  string summary = 2;
}

// One task card in the Fleet views (docs/32 § Renderer modules: fleet/).
message TaskView {
  string task_id = 1;
  string session_id = 2;
  string title = 3;
  TaskStatus state = 4;
  string created_at = 5;
  uint64 generation = 6;
  // Phase 7 item 1: non-empty when this task is a spawned child agent;
  // the fleet view groups children under their parent.
  string parent_task_id = 7;
}

message Fleet {
  repeated TaskView tasks = 1;
  // Sessions are created on demand; the desktop composer submits new tasks
  // against this session.
  string default_session_id = 2;
}

message SurfaceResponse {
  bool ok = 1;
  string error = 2;
  Fleet fleet = 3;
  TaskView task = 4;
  string session_id = 5;
  TaskEvents task_events = 6;
  CodeViewModel code_view = 7;
  RunDetailView run_detail = 8;
  DiffView diff = 9;
  OutputRefChunkView output_chunk = 10;
  RecentRepoList recent_repos = 11;
  RecentRepoView repo = 12;
  SettingsView settings = 13;
  DiffHunksView diff_hunks = 14;
  AgentResultView agent_result = 15;
}

// Paginated read of a stored tool-output reference (Phase 2.6): the full
// output of a shell.run lives behind the OutputRef in the runtime store;
// readers page through it with offset/max ranges.
message ReadOutputRefRequest {
  string output_ref_id = 1;
  uint64 offset = 2;
  uint64 max_bytes = 3;
}

message OutputRefChunkView {
  string output_ref_id = 1;
  uint64 offset = 2;
  bytes data = 3;
  uint64 total_length = 4;
}

// Steering: durable control event applied at safe boundaries (docs/14 §
// Steering). The note is queued in a race-free per-task outbox and rides
// as a user message on the in-flight run's NEXT turn boundary (or the
// next run's first boundary if none is live).
message SteerTaskCommand {
  string task_id = 1;
  string note = 2;
}

// Pause parks a running task in Waiting(UserInput); the in-flight run
// parks at the next turn boundary (the current turn, including its tool,
// finishes or is stopped by Stop).
message PauseTaskCommand {
  string task_id = 1;
}

// Stop cancels the task: the in-flight model stream aborts, the broker
// tool run is killed (no orphan process), the run aborts at or before the
// next turn boundary, and no new turns start (docs/14).
message StopTaskCommand {
  string task_id = 1;
  string reason = 2;
}

message GetRunDetailRequest {
  string task_id = 1;
}

// One RunStep in the run detail (docs/13 § RunStep): typed atomic step with
// its terminal state.
message RunStepView {
  string step_id = 1;
  string turn_id = 2;
  string step_type = 3;
  string state = 4; // prepared | completed | failed
  string failure_code = 5;
}

message TurnView {
  string turn_id = 1;
  string state = 2; // prepared | streaming | executing | verifying | completed | failed | interrupted
  repeated RunStepView steps = 3;
}

// Run detail assembled from the task's durable run-plane aggregates
// (Run/Turn/RunStep); committed facts only.
message RunDetailView {
  string task_id = 1;
  repeated TurnView turns = 2;
  string run_state = 3; // running | completed | failed
  string failure_code = 4;
}

message GetDiffRequest {
  string task_id = 1;
}

// Revision-bound diff of the task's worktree against its base revision
// (E2E-001 review surface substrate).
message DiffFileView {
  string path = 1;
  uint64 additions = 2;
  uint64 deletions = 3;
}

message DiffView {
  string task_id = 1;
  string branch = 2;
  string base_revision = 3;
  repeated DiffFileView files = 4;
}

message GetDiffHunksRequest {
  string task_id = 1;
}

// Hunk-level diff content for the review surface: one entry per changed
// range with its new-file start line (the hunk id used by review RPCs).
message DiffHunkView {
  string path = 1;
  uint64 new_start = 2;
  repeated string lines = 3;
}

message DiffHunksView {
  string task_id = 1;
  string branch = 2;
  string base_revision = 3;
  repeated DiffHunkView hunks = 4;
}

// Accept/reject decision on ONE hunk of the task worktree. Reject
// inverse-applies only that hunk; accept leaves the worktree untouched.
// Both outcomes append a durable ReviewHunkResolved event.
message ResolveReviewHunkCommand {
  string task_id = 1;
  string path = 2;
  uint64 new_start = 3;
  bool accepted = 4;
}

// Phase 7 item 1 — transactional subagent admission (docs/14): all-or-
// nothing. Capacity ticket (max concurrent children of the root), parent
// active at the expected generation, declared write-scope conflict check
// against active siblings, then a real child task through the scheduler
// with its own isolated worktree. Any failure refuses admission with no
// partial reservation.
message SpawnAgentCommand {
  string parent_task_id = 1;
  string objective = 2;
  // Comma-separated paths this child may write (advisory conflict
  // declaration checked against active siblings).
  string write_scope = 3;
  // Idempotent re-attach: a replayed spawn with the same key returns the
  // already-admitted child instead of spawning a second one.
  string idempotency_key = 4;
  // Generation fencing: admission requires the parent still at this
  // generation (0 = no fence).
  uint64 parent_generation = 5;
}

message ParkAgentCommand {
  string task_id = 1;
  string reason = 2;
}

message ResumeAgentCommand {
  string task_id = 1;
}

// Bounded wait for a child agent to reach a terminal state, then its
// SubagentResult view (summary + outcome, docs/14 § agent communication).
message AgentResultRequest {
  string task_id = 1;
  uint64 timeout_ms = 2;
}

message AgentResultView {
  string task_id = 1;
  string parent_task_id = 2;
  string state = 3;
  string summary = 4;
  string failure_code = 5;
}
